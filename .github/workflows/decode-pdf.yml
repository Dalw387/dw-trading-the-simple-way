name: Decode ebook PDF
on:
  push:
    paths:
      - "pdf-b64/**"
      - ".github/workflows/decode-pdf.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode base64 PDF
        run: |
          cat pdf-b64/part-*.txt | base64 -d > Trading-the-Simple-Way.pdf
          file Trading-the-Simple-Way.pdf || true
          ls -la Trading-the-Simple-Way.pdf
      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Trading-the-Simple-Way.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Add Trading the Simple Way PDF for bio download"
            git push
          fi
