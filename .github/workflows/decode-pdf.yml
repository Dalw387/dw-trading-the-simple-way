name: Decode ebook PDF
on:
  push:
    paths:
      - "pdf-b64/**"
      - ".github/workflows/decode-pdf.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and decode base64 PDF
        run: |
          set -euo pipefail
          if [ -f pdf-b64/all.txt ]; then
            echo "Using pdf-b64/all.txt"
            cat pdf-b64/all.txt | tr -d '\n\r[:space:]' | base64 -d > Trading-the-Simple-Way.pdf
          else
            ls pdf-b64/part-*.txt >/dev/null
            TOTAL=$(cat pdf-b64/part-*.txt | wc -c)
            echo "Total base64 bytes: $TOTAL from $(ls pdf-b64/part-*.txt | wc -l) parts"
            if [ "$TOTAL" -lt 700000 ]; then
              echo "Waiting for remaining pdf-b64 parts ($TOTAL < 700000)"
              exit 0
            fi
            cat $(ls pdf-b64/part-*.txt | sort) | tr -d '\n\r[:space:]' | base64 -d > Trading-the-Simple-Way.pdf
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Trading-the-Simple-Way.pdf")
          data = p.read_bytes()
          assert data.startswith(b"%PDF-"), f"not a PDF: {data[:20]!r}"
          assert len(data) > 100_000, f"PDF too small (truncated?): {len(data)}"
          print(f"OK PDF {len(data)} bytes")
          PY
          ls -la Trading-the-Simple-Way.pdf
      - name: Commit PDF if changed
        run: |
          set -euo pipefail
          if [ ! -f Trading-the-Simple-Way.pdf ]; then
            echo "No PDF produced yet — skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Trading-the-Simple-Way.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Add Trading the Simple Way PDF for bio download"
            git push
          fi
